services:
  # ASP.NET Core 8 API (serves Angular build as static files)
  app-api:
    build:
      context: .
      dockerfile: Application.Web/Dockerfile
    container_name: app-api
    ports:
      - "5095:8080"
    environment:
      # Runtime
      ASPNETCORE_ENVIRONMENT: "Production"
      # JWT
      JWT_ISSUER: "https://localhost"
      JWT_AUDIENCE: "https://localhost"
      JWT_SIGNING_KEY: "changeme-super-secret-32-bytes-minimum"
      # Secret encryption
      APP_SECRET_ENCRYPTION_KEY: "changeme-encryption-key"
      # RavenDB
      RAVENDBSETTINGS_URLS: "https://raven-db:8080"
      RAVENDBSETTINGS_DATABASE_NAME: "ApplicationDb"
      RAVENDBSETTINGS_CERTIFICATE_SUBJECT: ""
      RAVENDBSETTINGS_CERTIFICATE_PATH: "/certs/ravendb.pfx"
      RAVENDBSETTINGS_CERTIFICATE_PASSWORD: "changeme-ravendb-cert"
      # Evolution API integration
      EVOLUTION_API_BASE_URL: "http://evolution-api:8080"
      EVOLUTION_API_KEY: "changeme-evolution-key"
      EVOLUTION_API_INTEGRATION: "WHATSAPP-BAILEYS"
      # Hangfire
      HANGFIRE_CONNECTION_STRING: "Host=postgresql;Port=5432;Database=evolution;Username=evolution;Password=evolution"
    depends_on:
      raven-db:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
    volumes:
      - ./certs:/certs:ro

  # RavenDB (unsecured for development)
  raven-db:
    image: ravendb/ravendb:latest
    container_name: raven-db
    ports:
      - "8081:8080"
    environment:
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Setup_Mode: "Secured"
      RAVEN_Security_Certificate_Path: "/certs/ravendb.pfx"
      RAVEN_Security_Certificate_Password: "changeme-ravendb-cert"
      RAVEN_ServerUrl: "https://raven-db:8080"
      RAVEN_PublicServerUrl: "https://raven-db:8080"
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'echo > /dev/tcp/raven-db/8080'"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    volumes:
      - ravendb-data:/ravendb/data
      - ./certs:/certs:ro
    networks:
      - backend-network


  # Evolution API (WhatsApp)
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8082:8080"
    environment:
      AUTHENTICATION_API_KEY: "changeme-evolution-key"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@postgresql:5432/evolution"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution_exchange"
      CACHE_REDIS_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    volumes:
      - evolution-store:/evolution/store
      - evolution-instances:/evolution/instances
    networks:
      - backend-network
    depends_on:
      postgresql:
        condition: service_healthy

  # Postgres for Evolution API
  postgresql:
    image: postgres:16
    container_name: postgresql
    environment:
      POSTGRES_DB: "evolution"
      POSTGRES_USER: "evolution"
      POSTGRES_PASSWORD: "evolution"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - evolution-postgres:/var/lib/postgresql/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  ravendb-data:
  evolution-store:
  evolution-instances:
  evolution-postgres:
