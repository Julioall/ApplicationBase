  bdColor="var(--overlay-strong)"
  size="default"
  color="var(--accent-strong)"
  type="line-spin-fade"
  [fullScreen]="true"
></ngx-spinner>
<app-toast-container></app-toast-container>

</ng-container>

<ng-template #standaloneRoute>
  <router-outlet></router-outlet>
</ng-template>
