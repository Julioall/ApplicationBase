<ngx-spinner
  bdColor="var(--overlay-strong)"
  size="default"
  color="var(--accent-strong)"
  type="line-spin-fade"
  [fullScreen]="true"
></ngx-spinner>
<app-toast-container></app-toast-container>

<ng-container *ngIf="shouldShowDashboardShell; else standaloneRoute">
  <div class="dashboard-shell">
    <aside class="side-nav" [class.is-open]="isNavOpen">
      <div class="nav-head">
        <div class="nav-brand">
          <div class="logo-mark">
            <i class="fa fa-cubes"></i>
          </div>
          <div class="brand-copy">
            <span class="brand-title">ApplicationBase</span>
            <span class="brand-subtitle">{{ 'home.brandSubtitle' | translate }}</span>
          </div>
        </div>
      </div>
      <div class="nav-scroll">
        <div class="nav-list">
          <a *ngFor="let link of primaryNav" class="nav-link" [class.active]="link.active" href="#" (click)="closeNav()">
            <i class="{{ link.icon }}" aria-hidden="true"></i>
            <span>{{ link.label | translate }}</span>
            <span *ngIf="link.badge" class="pill">{{ link.badge | translate }}</span>
          </a>
          <a *ngFor="let link of favoriteNav" class="nav-link subtle" href="#" (click)="closeNav()">
            <i class="{{ link.icon }}" aria-hidden="true"></i>
            <span>{{ link.label | translate }}</span>
            <span *ngIf="link.badge" class="pill ghost">{{ link.badge | translate }}</span>
          </a>
        </div>
      </div>

      <div class="nav-footer" *ngIf="hasAdminAccess">
        <div class="nav-section" [class.is-collapsed]="!sectionState.admin">
          <button class="section-toggle" type="button" (click)="toggleSection('admin')">
            <span class="section-label">{{ 'home.settings' | translate }}</span>
            <i class="fa-solid" [ngClass]="sectionState.admin ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </button>
          <div class="nav-list" *ngIf="sectionState.admin">
            <a
              *ngFor="let link of adminShortcuts"
              class="nav-link minimal"
              [class.active]="isRouteActive(link.path)"
              [routerLink]="link.path"
              (click)="closeNav()"
            >
              <i class="{{ link.icon }}" aria-hidden="true"></i>
              <span>{{ link.label | translate }}</span>
            </a>
          </div>
        </div>
      </div>
    </aside>
    <div class="nav-scrim" *ngIf="isNavOpen" (click)="closeNav()"></div>

    <main class="dashboard-main">
      <header class="topbar">
        <button class="icon-btn ghost menu-toggle" type="button" [attr.aria-label]="'home.openMenu' | translate" (click)="toggleNav()">
          <i class="fa-solid" [ngClass]="isNavOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>
      <div class="breadcrumbs">
        <i [class]="breadcrumbIconClass"></i>
        <span>{{ breadcrumbLabelKey | translate }}</span>
      </div>

        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="search"
            [placeholder]="'home.searchPlaceholder' | translate"
            [attr.aria-label]="'home.searchAria' | translate"
          />
        </div>

        <div class="topbar-user">
          <button class="icon-btn ghost" type="button" [attr.aria-label]="'home.viewNotifications' | translate">
            <span class="dot"></span>
            <i class="fa-regular fa-bell"></i>
          </button>
          <div #profileMenu class="profile-menu" [class.is-open]="isProfileMenuOpen">
            <button
              class="profile-trigger"
              type="button"
            (click)="toggleProfileMenu($event)"
            [attr.aria-expanded]="isProfileMenuOpen"
            [attr.aria-label]="
              (isProfileMenuOpen ? 'home.profileMenu.closeLabel' : 'home.profileMenu.openLabel') | translate
            "
          >
              <div class="avatar">
                <img *ngIf="userAvatarUrl; else fallbackInitials" [src]="userAvatarUrl" alt="User avatar" />
                <ng-template #fallbackInitials>{{ userInitials }}</ng-template>
              </div>
              <i class="fa-solid" [ngClass]="isProfileMenuOpen ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            </button>

            <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
              <button class="dropdown-item" type="button" (click)="navigateToProfile()">
                <i class="fa-regular fa-user"></i>
                <div>
                  <span class="item-title">{{ 'home.profileMenu.profile' | translate }}</span>
                  <span class="item-subtitle">{{ 'home.profileMenu.profileSubtitle' | translate }}</span>
                </div>
              </button>

              <button class="dropdown-item" type="button" (click)="navigateToProfile()">
                <i class="fa-solid fa-sliders"></i>
                <div>
                  <span class="item-title">{{ 'home.profileMenu.settings' | translate }}</span>
                  <span class="item-subtitle">{{ 'home.profileMenu.settingsSubtitle' | translate }}</span>
                </div>
              </button>

              <button class="dropdown-item destructive" type="button" (click)="logout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <div>
                  <span class="item-title">{{ 'home.profileMenu.logout' | translate }}</span>
                  <span class="item-subtitle">{{ 'home.profileMenu.logoutSubtitle' | translate }}</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </header>

      <section class="route-content">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</ng-container>

<ng-template #standaloneRoute>
  <router-outlet></router-outlet>
</ng-template>
