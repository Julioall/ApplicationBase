<section class="task-detail" *ngIf="task">
  <div class="detail-header">
    <div class="eyebrow-row">
      <span class="eyebrow">{{ task.StartDate | date: 'dd-MM-yyyy' }} → {{ task.DueDate | date: 'dd-MM-yyyy' }}</span>
      <span class="priority-inline" *ngIf="task.Priority as pr">
        <ng-container [ngSwitch]="pr">
          <ng-container *ngSwitchCase="1">
            <i class="fa-solid fa-bolt low"></i>
            <i class="fa-solid fa-bolt muted"></i>
            <i class="fa-solid fa-bolt muted"></i>
          </ng-container>
          <ng-container *ngSwitchCase="2">
            <i class="fa-solid fa-bolt medium"></i>
            <i class="fa-solid fa-bolt medium"></i>
            <i class="fa-solid fa-bolt muted"></i>
          </ng-container>
          <ng-container *ngSwitchCase="3">
            <i class="fa-solid fa-bolt high"></i>
            <i class="fa-solid fa-bolt high"></i>
            <i class="fa-solid fa-bolt high"></i>
          </ng-container>
        </ng-container>
      </span>
    </div>
    <h2>{{ task.Title }}</h2>
    <div class="muted description-html" *ngIf="task.Description" [innerHTML]="task.Description"></div>
  </div>

  <section class="steps-section">
    <div class="steps-head">
      <div>
        <p class="label">{{ 'todo.steps.title' | translate }}</p>
        <p class="muted">{{ 'todo.steps.subtitle' | translate }}</p>
      </div>
      <div class="pill ghost">
        {{ getCompletedSteps() }}/{{ task.Steps.length || 0 }}
      </div>
    </div>

    <app-todo-steps-checklist
      [steps]="task.Steps || []"
      [canEdit]="canManage"
      (reorder)="onReorderSteps($event)"
      (toggle)="onToggleStep($event)"
      (titleChange)="onTitleChange($event)"
      (addStep)="onAddStep($event)"
      (deleteStep)="onDeleteStep($event)"
    ></app-todo-steps-checklist>
  </section>

  <footer class="detail-footer" *ngIf="canManage">
    <button class="btn ghost" type="button" (click)="archive()">
      <i class="fa-solid fa-box-archive"></i>
      <span>{{ 'todo.actions.archive' | translate }}</span>
    </button>
    <button class="btn danger ghost" type="button" (click)="deleteTask()">
      <i class="fa-regular fa-trash-can"></i>
      <span>{{ 'todo.actions.delete' | translate }}</span>
    </button>
    <button class="btn ghost" type="button" (click)="close()">{{ 'todo.actions.close' | translate }}</button>
  </footer>
</section>
