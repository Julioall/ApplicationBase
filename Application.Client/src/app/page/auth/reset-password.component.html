<div class="auth-wrapper">
  <div class="card">
    <header class="card-head">
      <h1>{{ 'auth.reset.title' | translate }}</h1>
      <p>{{ 'auth.reset.subtitle' | translate }}</p>
    </header>

    <form class="stack" [formGroup]="resetForm" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'auth.forgot.emailLabel' | translate }}</span>
        <input type="email" formControlName="email" autocomplete="email" />
        <small class="error" *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
          {{ 'auth.resetEmailRequired' | translate }}
        </small>
      </label>

      <label class="field">
        <span>{{ 'auth.forgot.codeLabel' | translate }}</span>
        <div class="code-inputs">
          <input
            *ngFor="let digit of codeDigits; let i = index"
            #codeInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="1"
            [value]="codeDigits[i]"
            (input)="onCodeInput(i, $event)"
            (paste)="onCodePaste($event)"
            autocomplete="one-time-code"
          />
        </div>
        <div class="code-actions">
          <button type="button" class="btn secondary" (click)="resendCode()" [disabled]="resendCooldown > 0 || isVerifyingCode || isSaving">
            <ng-container *ngIf="resendCooldown > 0; else resendLabel">
              {{ 'auth.reset.resendIn' | translate:{ seconds: resendCooldown } }}
            </ng-container>
            <ng-template #resendLabel>
              {{ 'auth.reset.resend' | translate }}
            </ng-template>
          </button>
        </div>
        <small class="helper success" *ngIf="codeValidated">{{ 'auth.reset.codeValidated' | translate }}</small>
        <small class="error" *ngIf="codeError">{{ codeError }}</small>
      </label>

      <ng-container *ngIf="codeValidated; else codePending">
        <label class="field">
          <span>{{ 'auth.password.new' | translate }}</span>
          <div class="password-input">
            <input
              [type]="passwordVisibility.newPassword ? 'text' : 'password'"
              autocomplete="new-password"
              formControlName="newPassword"
            />
            <button
              type="button"
              class="visibility-toggle"
              (click)="togglePasswordVisibility('newPassword')"
              [attr.aria-label]="passwordVisibility.newPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >
              <i class="fa-solid" [ngClass]="passwordVisibility.newPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
            </button>
          </div>
        </label>

        <label class="field">
          <span>{{ 'auth.password.confirm' | translate }}</span>
          <div class="password-input">
            <input
              [type]="passwordVisibility.confirmPassword ? 'text' : 'password'"
              autocomplete="new-password"
              formControlName="confirmPassword"
            />
            <button
              type="button"
              class="visibility-toggle"
              (click)="togglePasswordVisibility('confirmPassword')"
              [attr.aria-label]="passwordVisibility.confirmPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >
              <i class="fa-solid" [ngClass]="passwordVisibility.confirmPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
            </button>
          </div>
          <small class="error" *ngIf="resetForm.hasError('passwordMismatch') && resetForm.touched">
            {{ 'profile.messages.passwordMismatch' | translate }}
          </small>
        </label>
      </ng-container>

      <ng-template #codePending>
        <small class="helper">{{ 'auth.reset.validateFirst' | translate }}</small>
      </ng-template>

      <button class="btn primary w-100" type="submit" [disabled]="isSaving || isVerifyingCode || !codeValidated">
        <ng-container *ngIf="isSaving; else saveLabel">
          {{ 'auth.reset.saving' | translate }}
        </ng-container>
        <ng-template #saveLabel>
          {{ 'auth.reset.submit' | translate }}
        </ng-template>
      </button>
    </form>

    <footer class="card-footer">
      <button type="button" class="link-btn" (click)="goToLogin()">
        {{ 'auth.forgot.backToLogin' | translate }}
      </button>
    </footer>
  </div>
</div>
