<div class="min-h-screen grid place-items-center p-6 bg-page">
  <div class="w-full max-w-md bg-surface border border-border-soft rounded-xl shadow-soft p-5 flex flex-col gap-4">
    <header class="flex flex-col gap-1">
      <h1 class="m-0 text-text-primary text-2xl font-semibold">{{ 'auth.forgot.title' | translate }}</h1>
      <p class="mt-1 text-text-subtle text-sm">{{ 'auth.forgot.subtitle' | translate }}</p>
    </header>

    <form class="flex flex-col gap-3" [formGroup]="emailForm" (ngSubmit)="sendCode()">
      <label class="flex flex-col gap-2">
        <span class="font-semibold text-text-primary">{{ 'auth.forgot.emailLabel' | translate }}</span>
        <input type="email" [placeholder]="'auth.forgot.emailPlaceholder' | translate" formControlName="email" class="border border-border-soft rounded-md p-3 bg-surface-alt text-text-primary focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
        <small class="text-danger text-sm" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
          {{ 'auth.resetEmailRequired' | translate }}
        </small>
      </label>

      <button class="btn btn-primary w-full" type="submit" [disabled]="isSendingCode || cooldown > 0">
        <ng-container *ngIf="isSendingCode; else sendLabel">
          {{ 'auth.forgot.sending' | translate }}
        </ng-container>
        <ng-template #sendLabel>
          <ng-container *ngIf="cooldown > 0; else readyLabel">
            {{ 'auth.forgot.resendIn' | translate:{ seconds: cooldown } }}
          </ng-container>
          <ng-template #readyLabel>
            {{ hasSentCode ? ('auth.forgot.sent' | translate) : ('auth.forgot.sendCode' | translate) }}
          </ng-template>
        </ng-template>
      </button>
    </form>

    <div class="text-center text-text-subtle font-semibold" *ngIf="step !== 'email'">
      <span>{{ 'auth.forgot.codeStep' | translate }}</span>
    </div>

    <section class="flex flex-col gap-3" *ngIf="step !== 'email'" [formGroup]="codeForm">
      <label class="flex flex-col gap-2">
        <span class="font-semibold text-text-primary">{{ 'auth.forgot.codeLabel' | translate }}</span>
        <div class="grid grid-cols-6 gap-2">
          <input
            *ngFor="let digit of codeDigits; let i = index"
            #codeInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="1"
            [value]="codeDigits[i]"
            (input)="onCodeInput(i, $event)"
            (paste)="onCodePaste($event)"
            autocomplete="one-time-code"
            class="text-center text-lg p-3 border border-border-soft rounded-md bg-surface-alt text-text-primary focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent tracking-wider"
          />
        </div>
        <div class="flex gap-2 items-center mt-2">
          <button type="button" class="btn btn-primary" (click)="verifyCode()" [disabled]="isVerifyingCode || codeForm.invalid">
            <ng-container *ngIf="isVerifyingCode; else verifyLabel">
              {{ 'auth.reset.verifying' | translate }}
            </ng-container>
            <ng-template #verifyLabel>
              {{ 'auth.reset.verifyCode' | translate }}
            </ng-template>
          </button>
          <button type="button" class="btn btn-secondary" (click)="sendCode()" [disabled]="cooldown > 0 || isSendingCode">
            <ng-container *ngIf="cooldown > 0; else resendLabel">
              {{ 'auth.reset.resendIn' | translate:{ seconds: cooldown } }}
            </ng-container>
            <ng-template #resendLabel>
              {{ 'auth.reset.resend' | translate }}
            </ng-template>
          </button>
        </div>
        <small class="text-text-subtle text-sm" *ngIf="!codeValidated">{{ 'auth.forgot.codeHelper' | translate }}</small>
        <small class="text-success text-sm font-semibold" *ngIf="codeValidated">{{ 'auth.reset.codeValidated' | translate }}</small>
        <small class="text-danger text-sm" *ngIf="codeError">{{ codeError }}</small>
      </label>
    </section>

    <section class="flex flex-col gap-3" *ngIf="step === 'password'" [formGroup]="passwordForm">
      <label class="flex flex-col gap-2">
        <span class="font-semibold text-text-primary">{{ 'auth.password.new' | translate }}</span>
        <div class="flex items-center border border-border-soft rounded-md bg-surface-alt">
          <input
            [type]="passwordVisibility.newPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="newPassword"
            class="flex-1 border-none bg-transparent p-3 text-text-primary focus:outline-none"
          />
          <button
            type="button"
            class="border-none bg-transparent p-3 cursor-pointer text-text-subtle hover:text-text-primary transition-colors"
            (click)="togglePasswordVisibility('newPassword')"
            [attr.aria-label]="passwordVisibility.newPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <i class="fa-solid" [ngClass]="passwordVisibility.newPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        <small class="text-text-subtle text-sm">{{ 'profile.password.requirements' | translate }}</small>
      </label>

      <label class="flex flex-col gap-2">
        <span class="font-semibold text-text-primary">{{ 'auth.password.confirm' | translate }}</span>
        <div class="flex items-center border border-border-soft rounded-md bg-surface-alt">
          <input
            [type]="passwordVisibility.confirmPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
            class="flex-1 border-none bg-transparent p-3 text-text-primary focus:outline-none"
          />
          <button
            type="button"
            class="border-none bg-transparent p-3 cursor-pointer text-text-subtle hover:text-text-primary transition-colors"
            (click)="togglePasswordVisibility('confirmPassword')"
            [attr.aria-label]="passwordVisibility.confirmPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <i class="fa-solid" [ngClass]="passwordVisibility.confirmPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        <small class="text-danger text-sm" *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.touched">
          {{ 'profile.messages.passwordMismatch' | translate }}
        </small>
      </label>

      <button class="btn btn-primary w-full" type="button" (click)="submitPassword()" [disabled]="isSavingPassword || isVerifyingCode">
        <ng-container *ngIf="isSavingPassword; else savePwdLabel">
          {{ 'auth.reset.saving' | translate }}
        </ng-container>
        <ng-template #savePwdLabel>
          {{ 'auth.reset.submit' | translate }}
        </ng-template>
      </button>
    </section>

    <footer class="flex justify-center">
      <button type="button" class="border-none bg-transparent text-accent-strong cursor-pointer font-semibold hover:text-accent-strong/80 transition-colors" (click)="goToLogin()">
        {{ 'auth.forgot.backToLogin' | translate }}
      </button>
    </footer>
  </div>
</div>
