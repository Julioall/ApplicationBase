<div class="auth-wrapper">
  <div class="card">
    <header class="card-head">
      <h1>{{ 'auth.forgot.title' | translate }}</h1>
      <p>{{ 'auth.forgot.subtitle' | translate }}</p>
    </header>

    <form class="stack" [formGroup]="emailForm" (ngSubmit)="sendCode()">
      <label class="field">
        <span>{{ 'auth.forgot.emailLabel' | translate }}</span>
        <input type="email" [placeholder]="'auth.forgot.emailPlaceholder' | translate" formControlName="email" />
        <small class="error" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
          {{ 'auth.resetEmailRequired' | translate }}
        </small>
      </label>

      <button class="btn primary w-100" type="submit" [disabled]="isSendingCode || cooldown > 0">
        <ng-container *ngIf="isSendingCode; else sendLabel">
          {{ 'auth.forgot.sending' | translate }}
        </ng-container>
        <ng-template #sendLabel>
          <ng-container *ngIf="cooldown > 0; else readyLabel">
            {{ 'auth.forgot.resendIn' | translate:{ seconds: cooldown } }}
          </ng-container>
          <ng-template #readyLabel>
            {{ hasSentCode ? ('auth.forgot.sent' | translate) : ('auth.forgot.sendCode' | translate) }}
          </ng-template>
        </ng-template>
      </button>
    </form>

    <div class="divider" *ngIf="step !== 'email'">
      <span>{{ 'auth.forgot.codeStep' | translate }}</span>
    </div>

    <section class="stack" *ngIf="step !== 'email'" [formGroup]="codeForm">
      <label class="field">
        <span>{{ 'auth.forgot.codeLabel' | translate }}</span>
        <div class="code-inputs">
          <input
            *ngFor="let digit of codeDigits; let i = index"
            #codeInput
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="1"
            [value]="codeDigits[i]"
            (input)="onCodeInput(i, $event)"
            (paste)="onCodePaste($event)"
            autocomplete="one-time-code"
          />
        </div>
        <div class="code-actions">
          <button type="button" class="btn primary" (click)="verifyCode()" [disabled]="isVerifyingCode || codeForm.invalid">
            <ng-container *ngIf="isVerifyingCode; else verifyLabel">
              {{ 'auth.reset.verifying' | translate }}
            </ng-container>
            <ng-template #verifyLabel>
              {{ 'auth.reset.verifyCode' | translate }}
            </ng-template>
          </button>
          <button type="button" class="btn secondary" (click)="sendCode()" [disabled]="cooldown > 0 || isSendingCode">
            <ng-container *ngIf="cooldown > 0; else resendLabel">
              {{ 'auth.reset.resendIn' | translate:{ seconds: cooldown } }}
            </ng-container>
            <ng-template #resendLabel>
              {{ 'auth.reset.resend' | translate }}
            </ng-template>
          </button>
        </div>
        <small class="helper" *ngIf="!codeValidated">{{ 'auth.forgot.codeHelper' | translate }}</small>
        <small class="helper success" *ngIf="codeValidated">{{ 'auth.reset.codeValidated' | translate }}</small>
        <small class="error" *ngIf="codeError">{{ codeError }}</small>
      </label>
    </section>

    <section class="stack" *ngIf="step === 'password'" [formGroup]="passwordForm">
      <label class="field">
        <span>{{ 'auth.password.new' | translate }}</span>
        <div class="password-input">
          <input
            [type]="passwordVisibility.newPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="newPassword"
          />
          <button
            type="button"
            class="visibility-toggle"
            (click)="togglePasswordVisibility('newPassword')"
            [attr.aria-label]="passwordVisibility.newPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <i class="fa-solid" [ngClass]="passwordVisibility.newPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        <small class="helper">{{ 'profile.password.requirements' | translate }}</small>
      </label>

      <label class="field">
        <span>{{ 'auth.password.confirm' | translate }}</span>
        <div class="password-input">
          <input
            [type]="passwordVisibility.confirmPassword ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
          />
          <button
            type="button"
            class="visibility-toggle"
            (click)="togglePasswordVisibility('confirmPassword')"
            [attr.aria-label]="passwordVisibility.confirmPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <i class="fa-solid" [ngClass]="passwordVisibility.confirmPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        <small class="error" *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.touched">
          {{ 'profile.messages.passwordMismatch' | translate }}
        </small>
      </label>

      <button class="btn primary w-100" type="button" (click)="submitPassword()" [disabled]="isSavingPassword || isVerifyingCode">
        <ng-container *ngIf="isSavingPassword; else savePwdLabel">
          {{ 'auth.reset.saving' | translate }}
        </ng-container>
        <ng-template #savePwdLabel>
          {{ 'auth.reset.submit' | translate }}
        </ng-template>
      </button>
    </section>

    <footer class="card-footer">
      <button type="button" class="link-btn" (click)="goToLogin()">
        {{ 'auth.forgot.backToLogin' | translate }}
      </button>
    </footer>
  </div>
</div>
