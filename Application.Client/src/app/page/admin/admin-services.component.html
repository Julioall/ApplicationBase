<section class="admin-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Configurações</p>
      <h2>Serviço de e-mail</h2>
      <p class="subtitle">SMTP utilizado para recuperação de senha e comunicações automáticas.</p>
    </div>
    <span class="pill ghost">
      <i class="fa-solid fa-shield-halved"></i>
      Uso interno
    </span>
  </header>

  <article class="card">
    <header class="card-head">
      <div>
        <p class="eyebrow">SMTP</p>
        <h3>Parâmetros de entrega</h3>
        <p class="muted">Defina remetente, host e credenciais. A integração real será adicionada depois.</p>
      </div>
      <span class="pill">Em breve</span>
    </header>

    <form class="config-form" (ngSubmit)="saveConfig()">
      <div class="form-grid">
        <label>
          Remetente (nome)
          <input type="text" name="fromName" [(ngModel)]="emailConfig.fromName" />
        </label>
        <label>
          Remetente (e-mail)
          <input type="email" name="fromEmail" [(ngModel)]="emailConfig.fromEmail" required />
        </label>
        <label>
          Host SMTP
          <input type="text" name="host" [(ngModel)]="emailConfig.host" placeholder="smtp.seuprovedor.com" />
        </label>
        <label>
          Porta
          <input type="number" name="port" [(ngModel)]="emailConfig.port" min="1" />
        </label>
        <label>
          Segurança
          <select name="secure" [(ngModel)]="emailConfig.secure">
            <option value="none">Nenhuma</option>
            <option value="starttls">STARTTLS</option>
            <option value="ssl">SSL/TLS</option>
          </select>
        </label>
        <label>
          Usuário
          <input type="text" name="username" [(ngModel)]="emailConfig.username" />
        </label>
        <label>
          Senha
          <div class="password-input">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="emailConfig.password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="visibility-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >
              <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
            </button>
          </div>
        </label>
        <label class="full-row">
          URL de recuperação
          <input type="url" name="defaultResetUrl" [(ngModel)]="emailConfig.defaultResetUrl" />
        </label>
        <label class="full-row">
          E-mail para teste
          <input type="email" name="testEmail" [(ngModel)]="emailConfig.testEmail" placeholder="teste@exemplo.com" />
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="secondary" (click)="testConnection()" [disabled]="isTesting">
          <i class="fa-solid fa-paper-plane"></i>
          {{ isTesting ? 'Testando...' : 'Testar envio' }}
        </button>
        <button type="submit" [disabled]="isSaving">
          <i class="fa-solid fa-floppy-disk"></i>
          {{ isSaving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>

      <p *ngIf="statusMessage" class="status" [class.success]="statusType === 'success'" [class.error]="statusType === 'error'">
        {{ statusMessage }}
      </p>
    </form>
  </article>
</section>
