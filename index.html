<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Modern Modal Preview</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- DESIGN TOKENS (Agente.md) --- */
        :root {
            /* Palette Slate/Zinc */
            --bg-body: #f8fafc;
            --modal-bg: #ffffff;
            --input-bg: #f8fafc;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #ef4444;

            /* Geometry */
            --radius-modal: 16px;
            --radius-input: 8px;
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Background pattern simulado para testar o blur */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Botão apenas para abrir o modal na demo */
        .trigger-btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transition: 0.2s;
        }
        .trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }

        /* --- MODAL STYLES (O código que importa) --- */
        
        /* Backdrop com Blur Moderno */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.4); /* Slate 900 + Opacity */
            backdrop-filter: blur(4px); /* O "segredo" do visual moderno */
            display: flex; /* Flex para centralizar */
            align-items: center;
            justify-content: center;
            z-index: 1050;
            padding: 20px;
            
            /* Animação de entrada */
            animation: fadeIn 0.2s ease-out;
        }

        .modal-card {
            background: var(--modal-bg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: var(--radius-modal);
            box-shadow: var(--shadow-modal);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5); /* Borda sutil para contraste */
            
            /* Animação do card */
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header */
        .modal-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #fff;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-header .subtitle {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .btn-icon-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-icon-close:hover { background: #f1f5f9; color: var(--danger-color); }

        /* Body & Scroll */
        .modal-body {
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Layout Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Inputs Modernos */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 1;
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            font-size: 0.8rem;
            pointer-events: none;
            color: var(--text-secondary);
        }

        .modern-input {
            width: 100%;
            padding: 10px 16px 10px 40px; /* Padding left maior para o ícone */
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-input);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
            appearance: none; /* Remove estilo nativo */
        }

        .modern-input:focus {
            outline: none;
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .modern-input::placeholder { color: #94a3b8; }

        /* Chips / Tags */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .modern-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .modern-chip button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
        }
        .modern-chip button:hover { color: var(--danger-color); }

        /* Simulação do Quill Editor */
        .editor-wrapper {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-input);
            overflow: hidden;
        }
        .fake-toolbar {
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            gap: 12px;
            color: var(--text-secondary);
        }
        .fake-toolbar i { cursor: pointer; font-size: 0.9rem; }
        .fake-editor-content {
            background: #fff;
            padding: 12px;
            min-height: 100px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Footer */
        .modal-footer {
            padding: 20px 32px;
            border-top: 1px solid var(--border-color);
            background-color: #f8fafc;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-input);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        .btn-ghost:hover { background: #e2e8f0; color: var(--text-primary); }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* Responsive */
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .modal-card { height: 100%; max-height: 100%; border-radius: 0; }
        }
    </style>
</head>
<body>

    <button class="trigger-btn" onclick="toggleModal(true)">
        <i class="fa-solid fa-plus"></i> Abrir Modal de Exemplo
    </button>

    <div id="createModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card" onclick="event.stopPropagation()">
            
            <header class="modal-header">
                <div>
                    <h2>Nova Tarefa</h2>
                    <p class="subtitle">Preencha os dados para organizar sua agenda.</p>
                </div>
                <button class="btn-icon-close" onclick="toggleModal(false)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <form class="modal-body" onsubmit="event.preventDefault(); toggleModal(false);">
                
                <div class="form-group">
                    <label>Título da Tarefa</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-pen-to-square input-icon"></i>
                        <input type="text" placeholder="Ex: Finalizar documentação da API" class="modern-input">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Data de Início</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar input-icon"></i>
                            <input type="datetime-local" class="modern-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Data de Término</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar-check input-icon"></i>
                            <input type="datetime-local" class="modern-input">
                        </div>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Categoria</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-tag input-icon"></i>
                            <input type="text" placeholder="Busque ou crie..." list="categories" class="modern-input">
                            <datalist id="categories">
                                <option value="Frontend"></option>
                                <option value="Backend"></option>
                            </datalist>
                        </div>
                        <div class="chip-container">
                            <span class="modern-chip">
                                Development
                                <button type="button"><i class="fa-solid fa-xmark"></i></button>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Prioridade</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-layer-group input-icon"></i>
                            <select class="modern-input">
                                <option value="3">Alta</option>
                                <option value="2" selected>Média</option>
                                <option value="1">Baixa</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-arrow"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <div class="editor-wrapper">
                        <div class="fake-toolbar">
                            <i class="fa-solid fa-bold"></i>
                            <i class="fa-solid fa-italic"></i>
                            <i class="fa-solid fa-underline"></i>
                            <i class="fa-solid fa-list-ul"></i>
                        </div>
                        <div class="fake-editor-content" contenteditable="true">
                            Escreva os detalhes da tarefa aqui...
                        </div>
                    </div>
                </div>

            </form>

            <footer class="modal-footer">
                <button class="btn btn-ghost" onclick="toggleModal(false)">Cancelar</button>
                <button class="btn btn-primary" onclick="toggleModal(false)">
                    <i class="fa-solid fa-plus"></i> Criar Tarefa
                </button>
            </footer>

        </div>
    </div>

    <script>
        // Script simples para abrir/fechar o modal na demo
        function toggleModal(show) {
            const modal = document.getElementById('createModal');
            if (show) {
                modal.style.display = 'flex';
                // Reinicia a animação se quiser
                const card = modal.querySelector('.modal-card');
                card.style.animation = 'none';
                card.offsetHeight; /* trigger reflow */
                card.style.animation = 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            } else {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
